# DCCI – CI workflow: build and lint on push/PR so deployments stay safe
# Deployment itself is handled by Vercel (or your host) via Git integration.
name: Continuous Integration (CI)

on:
  push:
    branches: [main, staging]

  pull_request:
    branches: [main, staging]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Code Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install Node Package Dependencies
        run: npm ci

      - name: Lint Code
        run: npm run lint

      - name: Build Project
        run: npm run build
        env:
          # Build may need these; use placeholder if no secrets in repo
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
