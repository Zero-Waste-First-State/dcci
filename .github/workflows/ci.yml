# DCCI – CI workflow: build and lint on push/PR so deployments stay safe
# Deployment itself is handled by Vercel (or your host) via Git integration.
name: CI

on:
  #push:
  #  branches: [main, staging]
  #pull_request:
  #  branches: [main, staging]

  workflow_dispatch:

jobs:
  tests:
    if: false # <-- disabled for now
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase local dev setup
        run: supabase db start

      - name: Verify generated types are checked in
        run: |
          supbase gen types typescript --local > types.gen.ts
          if ! git diff --ignore-space-at-eol --exit-code --quiet types.gen.ts; then
            echo "Detected uncommitted changes after build. See status below:"
            git diff
            exit 1
          fi

  build-and-lint:
    if: false # <-- disabled for now
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          # Build may need these; use placeholder if no secrets in repo
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
