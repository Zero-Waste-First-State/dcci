name: Supabase Migrations - Production

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/migrations/**'

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment: Production – dcci

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.PRODUCTION_PROJECT_ID }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: latest

      - name: Link Supabase Project
        run: supabase link --project-ref ${{ vars.PRODUCTION_PROJECT_ID }}

      - name: Migrate Supabase DB changes
        run: supabase db push --remote --yes